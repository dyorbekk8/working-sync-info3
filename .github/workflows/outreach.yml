name: 24/7 Autonomous Outreach Engine

on:
  schedule:
    - cron: '0 */6 * * *' # Birmasdan o'chib qolsa, har 6 soatda qayta ishlab turadi
  workflow_dispatch:

jobs:
  run-outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # Maksimal ruxsat berilgan 6 soatlik taymer
    steps:
      - name: Code'ni yuklash
        uses: actions/checkout@v4

      - name: Python'ni sozlash
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Kutubxonalarni o'rnatish
        run: |
          python -m pip install --upgrade pip
          pip install playwright gspread oauth2client
          playwright install chromium

      - name: 24/7 Botni ishga tushirish
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          X_COOKIES: ${{ secrets.X_COOKIES }}
          INSTA_COOKIES: ${{ secrets.INSTA_COOKIES }}
          DISCORD_COOKIES: ${{ secrets.DISCORD_COOKIES }}
        run: python main.py
